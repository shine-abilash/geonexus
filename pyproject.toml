[project]
name = "geonexus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RitikM-AiDev", email = "ritik.aidev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
     "h5netcdf>=1.8.1",
    "keras>=3.15.1",
    "matplotlib>=3.11.1",
    "netcdf4>=1.7.4",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.0",
    "tensorflow>=2.21.0",
    "torch>=2.13.0",
    "xarray>=2026.7.0",
    
]

[project.scripts]
geonexus = "geonexus:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
